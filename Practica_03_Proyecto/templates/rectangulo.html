<!DOCTYPE html>
<html>
<head>
    <title>rectangulo</title>
</head>
<body>
    <h2>Calcular area y perimetro</h2>

    <form method="POST">
        <p>Ingresa la base:</p>
        <input type="number" step="any" name="base" required>

        <p>Ingresa la altura:</p>
        <input type="number" step="any" name="altura" required>

        <br><br>
        <button type="submit">Calcular</button>
    </form>

    {% if area is not none %}
        <p>El area es: {{ area }}</p>
        <p>El perimetro es: {{ perimetro }}</p>
    {% endif %}

</body>
</html>
